# Local development dependencies only. The API and web app run on the host.
# Ports bind to 127.0.0.1 so nothing is exposed to the network.
name: family-hub-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: family_hub
      POSTGRES_PASSWORD: family_hub  # local dev only, never used elsewhere
      POSTGRES_DB: family_hub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_hub"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
