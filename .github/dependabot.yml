version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      javascript: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule: { interval: monthly }
    # Major image upgrades are deliberate: a database major version needs a
    # dump and restore, and dev, CI, and production move together.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
